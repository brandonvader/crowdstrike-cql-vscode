# Highlights fenced code blocks tagged as CQL inside Markdown.
#
# ```logscale            (also: cql, lql, ngsiem, crowdstrike-cql, humio)
# #event_simpleName=ProcessRollup2
# ```

scopeName: markdown.crowdstrike-cql.codeblock
injectionSelector: 'L:text.html.markdown'

variables:
  langs: '(?i:cql|logscale|lql|ngsiem|crowdstrike-cql|humio)'

patterns:
  - include: '#fenced-code-block'

repository:
  fenced-code-block:
    begin: '(^|\G)(\s*)(`{3,}|~{3,})\s*({{langs}})((?:[^\w`~-][^`~]*)?)$'
    beginCaptures:
      '3': { name: punctuation.definition.markdown }
      '4': { name: fenced_code.block.language.markdown }
      '5': { name: fenced_code.block.language.attributes.markdown }
    end: '(^|\G)(\2|\s{0,3})(\3)\s*$'
    endCaptures:
      '3': { name: punctuation.definition.markdown }
    name: markup.fenced_code.block.markdown
    patterns:
      - begin: '(^|\G)(\s*)(.*)'
        while: '(^|\G)(?!\s*([`~]{3,})\s*$)'
        contentName: meta.embedded.block.crowdstrike-cql
        patterns:
          - include: source.crowdstrike-cql
